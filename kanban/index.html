<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kanban</title>
  </head>
  <body>
    <div>
      <h1>Kanban</h1>
      <div class="container">
        <div class="list">
          <h2>ToDo</h2>
          <div class="cards" draggable="true" id="card1">Wash Dishes</div>
          <div class="cards" draggable="true" id="card2">Buy Groceries</div>
        </div>
        <div class="list">
          <h2>In Progress</h2>

          <div class="cards" draggable="true" id="card3">Learn Coding</div>
        </div>
        <div class="list">
          <h2>Done</h2>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
