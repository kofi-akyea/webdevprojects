<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="start-div active">
      <h1>Quiz Game</h1>
      <p>Test your general knowledge with these fun questions</p>
      <button class="start-button">Start Quiz</button>
    </div>

    <!-- Questions div -->
    <div class="questions-div inactive">
      <h1>Question <span class="question-number"></span></h1>
      <h2>Score <span class="score-span"></span></h2>
      <p class="question-span">
        Test your general knowledge with these fun questions
      </p>
      <div class="options-div"></div>
      <button class="reset-button">Reset Quiz</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
